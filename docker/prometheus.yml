global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: fraud-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: fraud-stream-worker
    static_configs:
      - targets: ["faust-worker:9100"]
        labels:
          service: stream-scorer

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
